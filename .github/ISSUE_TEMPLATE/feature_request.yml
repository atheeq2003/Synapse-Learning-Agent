name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the learner's or maintainer's problem, not the solution yet.
      placeholder: When I ..., I can't ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How might Synapse solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prerequisite map
        - Tutor chat
        - Learning memory
        - Quizzes and mastery
        - Reviews and reminders
        - Organizations and admin
        - Self-hosting / deployment
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
