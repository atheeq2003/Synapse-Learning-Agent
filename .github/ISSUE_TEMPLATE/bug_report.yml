name: Bug report
description: Something isn't working as expected
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, **do not** open an
        issue: follow the [security policy](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Type ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prerequisite map
        - Tutor chat
        - Learning memory
        - Quizzes and mastery
        - Reviews and reminders
        - Organizations and admin
        - Self-hosting / deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether you're using the hosted demo or self-hosting.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, API keys or tokens before pasting.
      render: shell
